<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0D0D0F" stop-opacity="1"/><stop offset=".04" stop-color="#0D0D0F" stop-opacity="0"/><stop offset=".9" stop-color="#0D0D0F" stop-opacity="0"/><stop offset="1" stop-color="#0D0D0F" stop-opacity="1"/></linearGradient>
